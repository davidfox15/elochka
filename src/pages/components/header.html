<header class="header">
  <div class="header-left">
    <a href="/">@@include('logo.html', { height: '80px' })</a>
  </div>
  <div class="flex-spacer"></div>
  <div class="header-contacts">
    <!-- <span class="header-contacts--phone">34-34-34</span> -->
    <!-- <span class="header-contacts--email">elochka@mail.ru</span> -->
  </div>
  <!-- prettier-ignore -->
  <!-- @@include('button.html', { id: 'main-button', class: 'desktop-button', text: 'Главная' }) -->
  <a
    id="parents-button"
    href="parents.html"
    title="Информация для родителей"
    class="button desktop-button header-nav-button"
  >
    Родителям
  </a>
  <a
    id="sessions-button"
    href="smena.html#sessions-header"
    title="Расписание смен"
    class="button desktop-button header-nav-button"
  >
    Смены
  </a>
  <a
    id="info-button"
    href="documents.html"
    title="Документы"
    class="button desktop-button header-nav-button"
  >
    Документы
  </a>
  <button id="theme-toggle" class="button theme-toggle" type="button">
    <span class="theme-toggle-desktop">Тема: темная</span>
    <span class="theme-toggle-mobile" aria-hidden="true">🌙</span>
  </button>
  <button
    id="menu-button"
    class="mobile-button"
    type="button"
    aria-expanded="false"
    aria-controls="mobile-menu"
    aria-label="Открыть меню"
  >
    <svg
      class="menu-icon"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path d="M4 7H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M4 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
</header>
<nav id="mobile-menu" class="mobile-menu" aria-label="Мобильное меню">
  <a href="parents.html" class="button mobile-menu-link">Родителям</a>
  <a href="smena.html#sessions-header" class="button mobile-menu-link">Смены</a>
  <a href="documents.html" class="button mobile-menu-link">Документы</a>
</nav>
<script>
  (function () {
    var storageKey = "elochka-theme";
    var root = document.documentElement;
    var toggle = document.getElementById("theme-toggle");
    var menuButton = document.getElementById("menu-button");
    var mobileMenu = document.getElementById("mobile-menu");

    function closeMenu() {
      if (!mobileMenu || !menuButton) {
        return;
      }
      mobileMenu.classList.remove("mobile-menu-open");
      menuButton.setAttribute("aria-expanded", "false");
      menuButton.setAttribute("aria-label", "Открыть меню");
    }

    function toggleMenu() {
      if (!mobileMenu || !menuButton) {
        return;
      }

      var isOpen = mobileMenu.classList.toggle("mobile-menu-open");
      menuButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "Закрыть меню" : "Открыть меню",
      );
    }

    function setTheme(theme) {
      root.setAttribute("data-theme", theme);
      if (!toggle) {
        return;
      }
      var desktopText = toggle.querySelector(".theme-toggle-desktop");
      var mobileText = toggle.querySelector(".theme-toggle-mobile");
      if (desktopText) {
        desktopText.textContent =
          theme === "light" ? "Тема: светлая" : "Тема: темная";
      }
      if (mobileText) {
        mobileText.textContent = theme === "light" ? "☀" : "🌙";
      }
      toggle.setAttribute("aria-label", "Переключить тему");
    }

    var savedTheme = localStorage.getItem(storageKey);
    if (savedTheme === "light" || savedTheme === "dark") {
      setTheme(savedTheme);
    } else {
      setTheme(window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    }

    if (toggle) {
      toggle.addEventListener("click", function () {
        var nextTheme =
          root.getAttribute("data-theme") === "light" ? "dark" : "light";
        setTheme(nextTheme);
        localStorage.setItem(storageKey, nextTheme);
      });
    }

    if (menuButton) {
      menuButton.addEventListener("click", toggleMenu);
    }

    if (mobileMenu) {
      mobileMenu.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", closeMenu);
      });
    }

    document.addEventListener("click", function (event) {
      if (!mobileMenu || !menuButton) {
        return;
      }

      if (
        mobileMenu.classList.contains("mobile-menu-open") &&
        !mobileMenu.contains(event.target) &&
        !menuButton.contains(event.target)
      ) {
        closeMenu();
      }
    });
  })();
</script>
